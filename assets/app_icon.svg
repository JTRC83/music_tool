<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <filter id="dockShadow" x="-18%" y="-18%" width="136%" height="142%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
  </defs>

  <!-- Transparent safety area keeps macOS/PWA masks from clipping the ring. -->
  <rect width="1024" height="1024" fill="none"/>
  <image
    href="logo_round_source.png"
    x="82"
    y="82"
    width="860"
    height="860"
    preserveAspectRatio="xMidYMid meet"
    filter="url(#dockShadow)"
  />
</svg>
